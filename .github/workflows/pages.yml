name: Demo site

# Publishes the read-only demo to GitHub Pages. It only packages files already in the repository
# (the dashboard and the committed snapshot in demo/): no network fetches, no model, no secrets.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'public/**'
      - 'config/presets.json'
      - 'config/profile.json'
      - 'scripts/build-demo.mjs'
      - 'src/store.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build (refuses snapshots made with a personal profile or inventory)
        run: node scripts/build-demo.mjs dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job can publish, and only with the two permissions Pages deployment needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
